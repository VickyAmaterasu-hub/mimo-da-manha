<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mimo Admin - Gestão Profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF; --green:#4E7A3E;
  --shadow:0 10px 30px rgba(51,55,47,0.08); --radius:20px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust); display:flex; min-height:100vh; overflow-x:hidden;}

/* LOGIN SCREEN */
.login-screen{position:fixed; inset:0; background:var(--crust); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:#fff; padding:40px 30px; border-radius:30px; text-align:center; width:100%; max-width:380px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);}
.login-card h1{font-family:var(--font-display); margin:0 0 10px;}

/* TOPBAR MOBILE */
.mobile-header {
    display: none; position: fixed; top: 0; left: 0; right: 0; height: 60px;
    background: var(--crust); color: #fff; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 101;
}
.mobile-header .brand { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.btn-sair-mobile { background: #b91c1c; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; }

/* SIDEBAR (DESKTOP) */
.sidebar{width:260px; background:var(--crust); color:var(--cream); padding:40px 20px; display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100;}
.brand-admin{font-family:var(--font-display); font-size:1.5rem; margin-bottom:40px; display:flex; align-items:center; gap:12px; color:#fff;}
.sidebar nav{display:flex; flex-direction:column; gap:8px; flex:1;}
.sidebar nav button{text-align:left; background:none; border:none; color:rgba(255,255,255,0.5); padding:14px 18px; border-radius:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:12px; font-size:1rem; transition:0.3s;}
.sidebar nav button:hover{color:#fff; background:rgba(255,255,255,0.05);}
.sidebar nav button.active{background:var(--jam); color:#fff;}
.logout-btn{margin-top:auto; border:1px solid rgba(255,255,255,0.1); background:none; color:rgba(255,255,255,0.6); padding:12px; border-radius:12px; cursor:pointer; font-weight:600; text-align: center;}
.logout-btn:hover { background: #b91c1c; color: #fff; border-color: #b91c1c; }

/* CONTENT AREA */
.main-content{flex:1; margin-left:260px; padding:40px; width:100%;}
.panel{display:none; animation: fadeIn 0.4s ease-out;}
.panel.active{display:block;}
@keyframes fadeIn { from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:translateY(0);} }

h2{font-family:var(--font-display); font-size:2.2rem; margin:0 0 25px;}
.card{background:#fff; border-radius:var(--radius); padding:25px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:25px; overflow:hidden;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:25px;}

/* TABELAS */
.table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 15px; }
table{width:100%; border-collapse:collapse; min-width:700px;}
th{text-align:left; padding:18px 15px; border-bottom:2px solid var(--line); font-size:12px; color:var(--crust-soft); text-transform:uppercase; letter-spacing:1px;}
td{padding:18px 15px; border-bottom:1px solid var(--line); font-size:14px;}

/* BOTÕES */
.btn{padding:12px 22px; border-radius:100px; font-weight:700; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:0.2s; font-size:14px;}
.btn-primary{background:var(--jam); color:#fff;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--crust);}
.btn-success{background:var(--green); color:#fff;}
.btn-danger{background:#fee2e2; color:#b91c1c;}

input, select, textarea { width:100%; padding:14px; border:1.5px solid var(--line); border-radius:14px; font-family:inherit; margin-bottom:12px; background:#f9f8f4; font-size:16px;}
label{display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--crust-soft); text-transform: uppercase;}

/* STATUS BADGES */
.status-badge{padding:8px 14px; border-radius:100px; font-size:11px; font-weight:800; text-transform:uppercase; border:none; cursor:pointer;}
.st-preparacao{background: #fff4e5; color: #b76e00;}
.st-concluido{background: #e6f4ea; color: #1e7e34;}
.st-cancelado{background: #fce8e6; color: #c5221f;}

/* RANGE CARDS */
.range-card { background: #fff; border: 1px solid var(--line); padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.02)}

/* MOBILE AJUSTES */
@media (max-width: 900px) {
  body { flex-direction: column; background: #fcfbf7; }
  .mobile-header { display: flex; }
  .sidebar {
    width: 100%; height: 75px; bottom: 0; top: auto; left: 0;
    padding: 0 10px; flex-direction: row; border-top: 1px solid var(--line);
    background: #fff; box-shadow: 0 -5px 25px rgba(0,0,0,0.06);
  }
  .brand-admin, .logout-btn { display: none; }
  .sidebar nav { flex-direction: row; justify-content: space-around; align-items: center; width: 100%; gap: 0; }
  .sidebar nav button {
    flex-direction: column; font-size: 10px; gap: 4px; padding: 8px 5px;
    border-radius: 0; align-items: center; color: var(--crust-soft); flex: 1;
  }
  .sidebar nav button span { font-size: 20px; }
  .sidebar nav button.active { background: none; color: var(--jam); }
  .main-content { margin-left: 0; padding: 80px 15px 100px; }
  h2 { font-size: 1.8rem; text-align: center; }
  .grid-2 { grid-template-columns: 1fr; }
  .btn { width: 100%; }
}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--crust); color:#fff; padding:15px 30px; border-radius:100px; z-index:3000; display:none;}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <span style="font-size: 40px;">🥐</span>
    <h1>Mimo Admin</h1>
    <p style="color:var(--crust-soft); margin-bottom:25px;">Acesso Restrito</p>
    <input type="email" id="emailInput" placeholder="E-mail">
    <input type="password" id="passInput" placeholder="Senha">
    <button class="btn btn-primary" style="width:100%; padding:16px;" onclick="tryLogin()">Acessar Painel</button>
  </div>
</div>

<header class="mobile-header">
    <div class="brand">🥐 Mimo Admin</div>
    <button class="btn-sair-mobile" onclick="logout()">Sair</button>
</header>

<aside class="sidebar">
  <div class="brand-admin">🥐 Mimo Admin</div>
  <nav>
    <button data-panel="pedidos" class="active"><span>📦</span>Pedidos</button>
    <button data-panel="produtos"><span>🥐</span>Cardápio</button>
    <button data-panel="agenda"><span>📅</span>Datas</button>
    <button data-panel="config"><span>⚙️</span>Ajustes</button>
  </nav>
  <button class="logout-btn" onclick="logout()">Sair da Plataforma</button>
</aside>

<main class="main-content">
  
  <section class="panel active" id="panel-pedidos">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap: wrap;">
        <h2>Pedidos</h2>
        <button class="btn btn-success" onclick="exportOrdersToExcel()">📊 Exportar Excel</button>
    </div>
    <div class="card">
        <label>Filtrar por data</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="filterDate" style="margin-bottom:0; flex:1;">
            <button class="btn btn-primary" style="width:auto" onclick="applyOrderFilter()">Filtrar</button>
            <button class="btn btn-outline" style="width:auto" onclick="clearOrderFilter()">Limpar</button>
        </div>
    </div>
    <div class="card" style="padding: 0;">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Data</th><th>Status</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Ações</th></tr></thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>
  </section>

  <section class="panel" id="panel-produtos">
    <h2>Cardápio</h2>
    <div class="grid-2">
        <div class="card">
            <h3 id="formTitle" style="margin-top:0">Novo/Editar Produto</h3>
            <form id="productForm" onsubmit="return saveProduct(event)">
                <input type="hidden" id="prodId">
                <label>Nome</label><input type="text" id="prodName" required>
                <label>Categoria</label><select id="prodCategory" required></select>
                <label>Preço (R$)</label><input type="number" id="prodPrice" step="0.01" required>
                <label>Foto</label><input type="file" id="prodImage" accept="image/*" onchange="handleFile(this, 'product')">
                <label>Descrição</label><textarea id="prodDesc" rows="2"></textarea>
                <div id="prodImgPreview"></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Salvar Produto</button>
                <button type="button" class="btn btn-outline" onclick="resetForm()" style="width:100%; margin-top:8px">Cancelar</button>
            </form>
        </div>
        <div class="card">
            <h3 style="margin-top:0">Categorias</h3>
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="newCatName" placeholder="Nova..." style="margin-bottom:0">
                <button class="btn btn-primary" style="width:auto" onclick="addCategory()">Add</button>
            </div>
            <div id="categoryList"></div>
        </div>
    </div>
    <div class="card" style="padding: 0;">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Foto</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead>
                <tbody id="productsBody"></tbody>
            </table>
        </div>
    </div>
  </section>

  <section class="panel" id="panel-agenda">
    <h2>Datas Disponíveis</h2>
    <div class="card">
        <label>Abrir nova data no site</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="newDate" style="margin-bottom:0; flex:1;">
            <button class="btn btn-primary" style="width:auto" onclick="addDate()">Adicionar</button>
        </div>
    </div>
    <div id="dateList" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:15px;"></div>
  </section>

  <section class="panel" id="panel-config">
    <h2>Ajustes do Sistema</h2>
    <div class="grid-2">
        <div class="card">
            <h3>🖼️ Foto do Topo</h3>
            <input type="file" id="heroFile" accept="image/*" onchange="handleFile(this, 'hero')" style="display:none">
            <button class="btn btn-outline" style="width:100%; border-style:dashed" onclick="document.getElementById('heroFile').click()">📂 Subir Foto Local</button>
            <div id="heroPreview" style="margin-top:10px; width:100%; height:100px; border-radius:15px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;"></div>
        </div>
        <div class="card">
            <h3>📍 Localização</h3>
            <div style="display:flex; gap:10px;">
                <div style="flex:2"><label>CEP</label><input type="text" id="cfgCEP"></div>
                <div style="flex:1"><label>Nº</label><input type="text" id="cfgNumber"></div>
                <button class="btn btn-primary" style="margin-top:22px; height:46px" onclick="searchBakeryCEP()">OK</button>
            </div>
            <label>Endereço</label><input type="text" id="cfgAddress" readonly>
        </div>
    </div>

    <div class="card">
        <h3>🚲 Tabela de Frete por Raio</h3>
        <div style="background: var(--cream); padding: 15px; border-radius: 15px; margin-bottom: 15px;">
            <div style="display:flex; gap:10px; align-items: flex-end; flex-wrap: wrap;">
                <div style="flex: 1;"><label>Até KM</label><input type="number" id="rangeKm" step="0.1" style="margin-bottom:0"></div>
                <div style="flex: 1;"><label>Valor R$</label><input type="number" id="rangePrice" step="0.1" style="margin-bottom:0"></div>
                <button class="btn btn-primary" onclick="addDeliveryRange()">Add Regra</button>
            </div>
        </div>
        <div id="deliveryRangesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;"></div>
    </div>

    <div class="card">
        <h3>💬 WhatsApp e Custos</h3>
        <label>WhatsApp (5511...)</label><input type="text" id="cfgWA">
        <div class="grid-2">
            <div><label>R$ por KM (Excedente)</label><input type="number" id="cfgKmFee" step="0.10"></div>
            <div><label>Frete Mínimo Geral</label><input type="number" id="cfgMinFee" step="0.10"></div>
        </div>
    </div>
    <button class="btn btn-primary" onclick="saveAllSettings()" style="width:100%; padding:20px; font-size:1.1rem; margin-bottom: 20px;">Salvar Todas as Configurações</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAEcISPJh7Eoo4QlTygiB3NmLyPzjNr7w",
    authDomain: "mimo-da-manha.firebaseapp.com",
    databaseURL: "https://mimo-da-manha-default-rtdb.firebaseio.com",
    projectId: "mimo-da-manha",
    storageBucket: "mimo-da-manha.firebasestorage.app",
    messagingSenderId: "378412741404",
    appId: "1:378412741404:web:f091f18e4c40c9bf4800d9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let currentProducts = [], currentCategories = [], currentOrders = {}, currentRanges = [], tempHeroData = "", tempProductImageData = "";

  window.tryLogin = async () => {
    const e = document.getElementById('emailInput').value, p = document.getElementById('passInput').value;
    try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Acesso Negado"); }
  }
  window.logout = () => confirm("Deseja realmente sair?") && signOut(auth).then(()=> location.reload());
  onAuthStateChanged(auth, user => { if(user) { document.getElementById('loginScreen').style.display='none'; initApp(); } });

  function initApp() { syncOrders(); syncProducts(); syncSettings(); syncCategories(); syncDates(); }

  document.querySelectorAll('.sidebar nav button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    };
  });

  function syncOrders() { onValue(ref(db, 'orders'), snap => { currentOrders = snap.val() || {}; renderOrders(); }); }
  function renderOrders(filter = "") {
    const body = document.getElementById('ordersBody');
    let entries = Object.entries(currentOrders).reverse();
    if(filter) entries = entries.filter(([id, o]) => o.createdAt.includes(filter));
    body.innerHTML = entries.map(([id, o]) => `
      <tr>
        <td>${new Date(o.createdAt).toLocaleString('pt-BR')}</td>
        <td><select onchange="updateStatus('${id}', this.value)" class="status-badge st-${o.status || 'preparacao'}"><option value="preparacao" ${o.status==='preparacao'?'selected':''}>Pendente</option><option value="concluido" ${o.status==='concluido'?'selected':''}>Concluído</option><option value="cancelado" ${o.status==='cancelado'?'selected':''}>Cancelado</option></select></td>
        <td>${o.customer.name}</td>
        <td style="font-size:12px">${o.items.map(i => `${i.qty}x ${i.name}`).join('<br>')}</td>
        <td style="font-weight:700">R$ ${o.total.toFixed(2)}</td>
        <td><button class="btn btn-danger" style="padding:6px" onclick="deleteOrder('${id}')">🗑️</button></td>
      </tr>
    `).join('');
  }
  window.applyOrderFilter = () => renderOrders(document.getElementById('filterDate').value);
  window.clearOrderFilter = () => { document.getElementById('filterDate').value = ""; renderOrders(); }
  window.updateStatus = (id, val) => update(ref(db, `orders/${id}`), { status: val });
  window.deleteOrder = id => confirm("Excluir?") && remove(ref(db, `orders/${id}`));

  function syncProducts() {
    onValue(ref(db, 'products'), snap => {
      currentProducts = snap.val() || [];
      document.getElementById('productsBody').innerHTML = currentProducts.map((p, idx) => `
        <tr>
          <td><img src="${p.img}" width="45" height="45" style="border-radius:10px; object-fit:cover;"></td>
          <td><strong>${p.name}</strong></td>
          <td>R$ ${p.price.toFixed(2)}</td>
          <td><button class="btn btn-outline" onclick="editProduct(${idx})">✏️</button> <button class="btn btn-danger" onclick="deleteProduct(${idx})">🗑️</button></td>
        </tr>
      `).join('');
    });
  }
  window.handleFile = (input, type) => {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxW = type === 'hero' ? 1000 : 500;
            const ratio = maxW / img.width;
            canvas.width = maxW; canvas.height = img.height * ratio;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = canvas.toDataURL('image/jpeg', 0.8);
            if(type === 'hero') { tempHeroData = data; document.getElementById('heroPreview').innerHTML = `<img src="${data}" style="width:100%; height:100%; object-fit:cover;">`; }
            else { tempProductImageData = data; document.getElementById('prodImgPreview').innerHTML = `<img src="${data}" width="80" style="border-radius:12px;">`; }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
  window.saveProduct = (e) => {
    e.preventDefault();
    const id = document.getElementById('prodId').value;
    const p = { name: document.getElementById('prodName').value, category: document.getElementById('prodCategory').value, price: parseFloat(document.getElementById('prodPrice').value), desc: document.getElementById('prodDesc').value, active: true, img: tempProductImageData || (id !== "" ? currentProducts[id].img : ""), id: id !== "" ? currentProducts[id].id : "p"+Date.now() };
    if(id !== "") currentProducts[id] = p; else currentProducts.push(p);
    set(ref(db, 'products'), currentProducts).then(()=> { showToast("Salvo!"); resetForm(); });
    return false;
  }
  window.editProduct = idx => {
    const p = currentProducts[idx];
    document.getElementById('prodId').value = idx; document.getElementById('prodName').value = p.name; document.getElementById('prodCategory').value = p.category; document.getElementById('prodPrice').value = p.price; document.getElementById('prodDesc').value = p.desc || ""; document.getElementById('prodImgPreview').innerHTML = `<img src="${p.img}" width="80" style="border-radius:12px;">`;
    document.getElementById('formTitle').innerText = "Editando...";
    document.querySelector('[data-panel="produtos"]').click();
  }
  window.deleteProduct = idx => confirm("Excluir?") && currentProducts.splice(idx,1) && set(ref(db, 'products'), currentProducts);

  function syncCategories() {
    onValue(ref(db, 'categories'), s => {
        currentCategories = s.val() || ["Pães", "Cookies", "Geleias"];
        document.getElementById('prodCategory').innerHTML = currentCategories.map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('categoryList').innerHTML = currentCategories.map(c => `<div style="background:var(--dawn-1); padding:8px 15px; border-radius:100px; display:flex; align-items:center; gap:10px; margin-bottom:5px;">${c} <button onclick="removeCategory('${c}')" style="background:none; border:none; color:red; cursor:pointer;">×</button></div>`).join('');
    });
  }
  window.addCategory = () => {
    const n = document.getElementById('newCatName').value.trim();
    if(n && !currentCategories.includes(n)) { currentCategories.push(n); set(ref(db, 'categories'), currentCategories); document.getElementById('newCatName').value=""; }
  }
  window.removeCategory = c => confirm("Remover?") && set(ref(db, 'categories'), currentCategories.filter(x => x !== c));

  function syncDates() {
    onValue(ref(db, 'dates'), s => {
        const dates = s.val() || [];
        document.getElementById('dateList').innerHTML = dates.map(d => `<div class="card" style="padding:15px; margin-bottom:0; display:flex; justify-content:space-between; align-items:center;"><strong>${d.split('-').reverse().join('/')}</strong><button class="btn btn-danger" style="padding:5px 10px" onclick="removeDate('${d}')">✕</button></div>`).join('');
    });
  }
  window.addDate = () => {
    const d = document.getElementById('newDate').value;
    if(d) get(ref(db, 'dates')).then(snap => { let list = snap.val() || []; if(!list.includes(d)) { list.push(d); set(ref(db, 'dates'), list.sort()); } });
  }
  window.removeDate = d => confirm("Remover?") && get(ref(db, 'dates')).then(snap => { let list = snap.val() || []; set(ref(db, 'dates'), list.filter(x => x !== d)); });

  window.addDeliveryRange = () => {
      const km = parseFloat(document.getElementById('rangeKm').value), price = parseFloat(document.getElementById('rangePrice').value);
      if(km && !isNaN(price)) { currentRanges.push({ maxKm: km, price: price }); currentRanges.sort((a,b) => a.maxKm - b.maxKm); renderRanges(); document.getElementById('rangeKm').value = ""; document.getElementById('rangePrice').value = ""; }
  }
  window.removeRange = idx => { currentRanges.splice(idx, 1); renderRanges(); }
  function renderRanges() {
      document.getElementById('deliveryRangesList').innerHTML = currentRanges.map((r, idx) => `
        <div class="range-card">
            <div style="display:flex; align-items:center; gap:10px;"><div style="background:var(--dawn-1); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700;">${idx+1}</div>
            <div style="font-size:13px">Até <b>${r.maxKm}km</b>: <b>R$ ${r.price.toFixed(2)}</b></div></div>
            <button class="btn btn-danger" style="padding:5px 8px" onclick="removeRange(${idx})">✕</button>
        </div>
      `).join('');
  }

  window.searchBakeryCEP = async () => {
    const cep = document.getElementById('cfgCEP').value.replace(/\D/g,''), num = document.getElementById('cfgNumber').value;
    if(cep.length === 8) {
        try {
            const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`), d = await r.json(), addr = `${d.logradouro}, ${num}, ${d.localidade}`;
            document.getElementById('cfgAddress').value = addr;
            const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr+', Brasil')}`), gd = await g.json();
            if(gd[0]) { update(ref(db, 'settings'), { storeLat: parseFloat(gd[0].lat), storeLng: parseFloat(gd[0].lon) }); showToast("Localização salva!"); }
        } catch(e){ alert("Erro no CEP"); }
    }
  }
  window.saveAllSettings = () => {
    const s = { whatsapp: document.getElementById('cfgWA').value, deliveryPerKm: parseFloat(document.getElementById('cfgKmFee').value) || 0, deliveryMinFee: parseFloat(document.getElementById('cfgMinFee').value) || 0, storeNumber: document.getElementById('cfgNumber').value, storeCEP: document.getElementById('cfgCEP').value, storeAddress: document.getElementById('cfgAddress').value, deliveryRanges: currentRanges };
    if(tempHeroData) s.heroImg = tempHeroData;
    update(ref(db, 'settings'), s).then(() => showToast("Ajustes Salvos!"));
  }
  function syncSettings() {
    get(ref(db, 'settings')).then(snap => {
      const v = snap.val() || {};
      document.getElementById('cfgWA').value = v.whatsapp || ""; document.getElementById('cfgKmFee').value = v.deliveryPerKm || ""; document.getElementById('cfgMinFee').value = v.deliveryMinFee || ""; document.getElementById('cfgNumber').value = v.storeNumber || ""; document.getElementById('cfgCEP').value = v.storeCEP || ""; document.getElementById('cfgAddress').value = v.storeAddress || "";
      currentRanges = v.deliveryRanges || []; renderRanges();
      if(v.heroImg) document.getElementById('heroPreview').innerHTML = `<img src="${v.heroImg}" style="width:100%; height:100%; object-fit:cover;">`;
    });
  }

  window.resetForm = () => { document.getElementById('productForm').reset(); document.getElementById('prodId').value=""; document.getElementById('prodImgPreview').innerHTML=""; document.getElementById('formTitle').innerText = "Novo Produto"; tempProductImageData = ""; }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=> t.style.display='none', 3000); }
  window.exportOrdersToExcel = function() { XLSX.writeFile(XLSX.utils.table_to_book(document.querySelector("#ordersBody").parentElement), "Pedidos_Mimo.xlsx"); }
</script>
</body>
</html>
