<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mimo Admin - Gestão Profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF; --green:#4E7A3E;
  --shadow:0 10px 30px rgba(51,55,47,0.08); --radius:20px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust); display:flex; min-height:100vh; overflow-x:hidden;}
.login-screen{position:fixed; inset:0; background:var(--crust); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:#fff; padding:40px 30px; border-radius:30px; text-align:center; width:100%; max-width:380px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);}
.mobile-header { display: none; position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--crust); color: #fff; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 101; }
.btn-sair-mobile { background: #b91c1c; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; }
.sidebar{width:260px; background:var(--crust); color:var(--cream); padding:40px 20px; display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100;}
.brand-admin{font-family:var(--font-display); font-size:1.5rem; margin-bottom:40px; display:flex; align-items:center; gap:12px; color:#fff;}
.sidebar nav{display:flex; flex-direction:column; gap:8px; flex:1;}
.sidebar nav button{text-align:left; background:none; border:none; color:rgba(255,255,255,0.5); padding:14px 18px; border-radius:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:12px; font-size:1rem; transition:0.3s;}
.sidebar nav button:hover, .sidebar nav button.active{color:#fff; background:rgba(255,255,255,0.1);}
.sidebar nav button.active{background:var(--jam);}
.logout-btn-sidebar { margin-top: auto; background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
.main-content{flex:1; margin-left:260px; padding:40px; width:100%;}
.panel{display:none; animation: fadeIn 0.4s ease-out;}
.panel.active{display:block;}
@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
h2{font-family:var(--font-display); font-size:2.2rem; margin:0 0 25px;}
.card{background:#fff; border-radius:var(--radius); padding:25px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:25px; overflow: hidden;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:25px;}
.table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 15px; }
table{width:100%; border-collapse:collapse; min-width:700px;}
th{text-align:left; padding:18px 15px; border-bottom:2px solid var(--line); font-size:12px; color:var(--crust-soft); text-transform:uppercase; letter-spacing:1px;}
td{padding:18px 15px; border-bottom:1px solid var(--line); font-size:14px;}
.btn{padding:12px 22px; border-radius:100px; font-weight:700; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:0.2s; font-size:14px;}
.btn-primary{background:var(--jam); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--crust);}
.btn-danger{background:#fee2e2; color:#b91c1c;}
input, select, textarea { width:100%; padding:14px; border:1.5px solid var(--line); border-radius:14px; font-family:inherit; margin-bottom:12px; background:#f9f8f4; font-size:16px;}
label{display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--crust-soft); text-transform: uppercase;}
@media (max-width: 900px) { .mobile-header { display: flex; } .sidebar { width: 100%; height: 70px; bottom: 0; top: auto; left: 0; padding: 0 10px; flex-direction: row; border-top: 1px solid var(--line); background: #fff; box-shadow: 0 -5px 25px rgba(0,0,0,0.06); } .brand-admin, .logout-btn-sidebar { display: none; } .sidebar nav { flex-direction: row; justify-content: space-around; align-items: center; width: 100%; gap: 0; } .sidebar nav button { flex-direction: column; font-size: 10px; gap: 4px; padding: 8px 5px; border-radius: 0; align-items: center; color: var(--crust-soft); flex: 1; } .main-content { margin-left: 0; padding: 80px 15px 100px; } h2 { font-size: 1.8rem; text-align: center; } .grid-2 { grid-template-columns: 1fr; } .btn { width: 100%; } }
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--crust); color:#fff; padding:15px 30px; border-radius:100px; z-index:3000; display:none;}
.cat-chip { background: var(--dawn-1); color: var(--jam-dark); padding: 8px 16px; border-radius: 100px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; margin-bottom: 5px;}
.cat-chip button { background: none; border: none; color: #b91c1c; cursor: pointer; font-size: 18px; padding: 0; }
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <span style="font-size: 40px;">🥐</span>
    <h1>Mimo Admin</h1>
    <input type="email" id="emailInput" placeholder="E-mail">
    <input type="password" id="passInput" placeholder="Senha">
    <button class="btn btn-primary" style="width:100%; margin-top:15px; padding:16px;" onclick="tryLogin()">Entrar</button>
  </div>
</div>
<header class="mobile-header"><span>🥐 Mimo Admin</span><button class="btn-sair-mobile" onclick="logout()">Sair</button></header>
<aside class="sidebar"><div class="brand-admin">🥐 Mimo Admin</div><nav><button data-panel="pedidos" class="active"><span>📦</span>Pedidos</button><button data-panel="produtos"><span>🥐</span>Cardápio</button><button data-panel="agenda"><span>📅</span>Datas</button><button data-panel="config"><span>⚙️</span>Ajustes</button></nav><button class="logout-btn-sidebar" onclick="logout()">Sair</button></aside>
<main class="main-content">
  <section class="panel active" id="panel-pedidos">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><h2>Pedidos</h2><button class="btn btn-primary" onclick="exportOrdersToExcel()">📊 Excel</button></div>
    <div class="card"><div class="table-responsive"><table><thead><tr><th>Data</th><th>Cliente</th><th>Resumo</th><th>Total</th><th>Ações</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div>
  </section>
  <section class="panel" id="panel-produtos">
    <h2>Cardápio</h2>
    <div class="grid-2">
        <div class="card"><h3 id="formTitle">Novo Produto</h3><form id="productForm" onsubmit="return saveProduct(event)"><input type="hidden" id="prodId"><label>Nome</label><input type="text" id="prodName" required><label>Categoria</label><select id="prodCategory" required></select><label>Preço</label><input type="number" id="prodPrice" step="0.01" required><label>Foto</label><input type="file" id="prodImage" onchange="handleFile(this, 'product')"><button type="submit" class="btn btn-primary" style="width:100%">Salvar</button></form></div>
        <div class="card"><h3>Categorias</h3><div style="display:flex; gap:10px;"><input type="text" id="newCatName" placeholder="Nova..." style="margin-bottom:0"><button class="btn btn-primary" onclick="addCategory()">Add</button></div><div id="categoryList"></div></div>
    </div>
    <div class="card"><div class="table-responsive"><table><thead><tr><th>Foto</th><th>Nome</th><th>Ações</th></tr></thead><tbody id="productsBody"></tbody></table></div></div>
  </section>
  <section class="panel" id="panel-agenda"><h2>Datas</h2><div class="card"><div style="display:flex; gap:10px;"><input type="date" id="newDate" style="margin-bottom:0; flex:1;"><button class="btn btn-primary" onclick="addDate()">Add</button></div><div id="dateList"></div></div></section>
  <section class="panel" id="panel-config">
    <h2>Ajustes</h2>
    <div class="card"><h3>Foto Topo</h3><input type="file" accept="image/*" onchange="handleFile(this, 'hero')"><div id="heroPreview"></div></div>
    <div class="card"><h3>📍 Padaria</h3><div style="display:flex; gap:10px;"><input type="text" id="cfgCEP" placeholder="CEP" style="flex:2"><input type="text" id="cfgNumber" placeholder="Nº" style="flex:1"><button class="btn btn-primary" onclick="searchBakeryCEP()">OK</button></div><input type="text" id="cfgAddress" readonly></div>
    <div class="card">
        <h3>🚲 Frete por Raio</h3>
        <div style="display:flex; gap:10px; align-items:flex-end;"><div style="flex:1;"><label>Até KM</label><input type="number" id="rangeKm" step="0.1"></div><div style="flex:1;"><label>Valor</label><input type="number" id="rangePrice" step="0.1"></div><button class="btn btn-primary" onclick="addDeliveryRange()">Add</button></div>
        <div id="deliveryRangesList"></div>
    </div>
    <div class="card"><label>WhatsApp</label><input type="text" id="cfgWA"><button class="btn btn-primary" style="width:100%" onclick="saveAllSettings()">Salvar Tudo</button></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAEcISPJh7Eoo4QlTygiB3NmLyPzjNr7w",
    authDomain: "mimo-da-manha.firebaseapp.com",
    databaseURL: "https://mimo-da-manha-default-rtdb.firebaseio.com",
    projectId: "mimo-da-manha",
    storageBucket: "mimo-da-manha.firebasestorage.app",
    messagingSenderId: "378412741404",
    appId: "1:378412741404:web:f091f18e4c40c9bf4800d9"
  };

  const app = initializeApp(firebaseConfig), db = getDatabase(app), auth = getAuth(app);
  let currentProducts = [], currentCategories = [], currentOrders = {}, currentRanges = [], tempHeroData = "", tempProductImageData = "";

  window.tryLogin = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passInput').value); } catch(err) { alert("Senha incorreta"); } }
  window.logout = () => signOut(auth).then(()=> location.reload());
  onAuthStateChanged(auth, user => { if(user) { document.getElementById('loginScreen').style.display='none'; initApp(); } });

  function initApp() { syncOrders(); syncProducts(); syncSettings(); syncCategories(); syncDates(); }

  document.querySelectorAll('.sidebar nav button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    };
  });

  function syncOrders() { onValue(ref(db, 'orders'), s => { currentOrders = s.val() || {}; const body = document.getElementById('ordersBody'); body.innerHTML = Object.entries(currentOrders).reverse().map(([id, o]) => `<tr><td>${new Date(o.createdAt).toLocaleDateString()}</td><td>${o.customer.name}</td><td>${o.items.map(i => i.name).join(', ')}</td><td>R$ ${o.total.toFixed(2)}</td><td><button class="btn btn-danger" onclick="deleteOrder('${id}')">🗑️</button></td></tr>`).join(''); }); }
  window.deleteOrder = id => confirm("Excluir?") && remove(ref(db, `orders/${id}`));

  function syncProducts() { onValue(ref(db, 'products'), s => { currentProducts = s.val() || []; document.getElementById('productsBody').innerHTML = currentProducts.map((p, idx) => `<tr><td><img src="${p.img}" width="45"></td><td>${p.name}</td><td><button class="btn btn-outline" onclick="editProduct(${idx})">✏️</button></td></tr>`).join(''); }); }
  window.handleFile = (input, type) => {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image(); img.onload = () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            const maxW = type === 'hero' ? 1000 : 500; const ratio = maxW / img.width;
            canvas.width = maxW; canvas.height = img.height * ratio; ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = canvas.toDataURL('image/jpeg', 0.8);
            if(type === 'hero') { tempHeroData = data; } else { tempProductImageData = data; }
        }; img.src = e.target.result;
    }; reader.readAsDataURL(input.files[0]);
  }

  window.saveProduct = e => { e.preventDefault(); const id = document.getElementById('prodId').value; const p = { name: document.getElementById('prodName').value, category: document.getElementById('prodCategory').value, price: parseFloat(document.getElementById('prodPrice').value), active: true, img: tempProductImageData || (id !== "" ? currentProducts[id].img : ""), id: id !== "" ? currentProducts[id].id : "p"+Date.now() }; if(id !== "") currentProducts[id] = p; else currentProducts.push(p); set(ref(db, 'products'), currentProducts).then(()=> { showToast("Salvo!"); resetForm(); }); return false; }
  window.editProduct = idx => { const p = currentProducts[idx]; document.getElementById('prodId').value = idx; document.getElementById('prodName').value = p.name; document.getElementById('prodCategory').value = p.category; document.getElementById('prodPrice').value = p.price; document.querySelector('[data-panel="produtos"]').click(); }
  
  function syncCategories() { onValue(ref(db, 'categories'), s => { currentCategories = s.val() || ["Pães", "Biscoitos", "Geleias"]; document.getElementById('prodCategory').innerHTML = currentCategories.map(c => `<option value="${c}">${c}</option>`).join(''); document.getElementById('categoryList').innerHTML = currentCategories.map(c => `<div class="cat-chip">${c} <button onclick="removeCategory('${c}')">×</button></div>`).join(''); }); }
  window.addCategory = () => { const n = document.getElementById('newCatName').value; if(n && !currentCategories.includes(n)) { currentCategories.push(n); set(ref(db, 'categories'), currentCategories); document.getElementById('newCatName').value=""; } }
  window.removeCategory = c => set(ref(db, 'categories'), currentCategories.filter(x => x !== c));

  function syncDates() { onValue(ref(db, 'dates'), s => { document.getElementById('dateList').innerHTML = (s.val() || []).map(d => `<div style="display:flex; justify-content:space-between; margin-bottom:10px">${d} <button class="btn btn-danger" onclick="removeDate('${d}')">✕</button></div>`).join(''); }); }
  window.addDate = () => { const d = document.getElementById('newDate').value; if(d) get(ref(db, 'dates')).then(s => { let list = s.val() || []; list.push(d); set(ref(db, 'dates'), list.sort()); }); }
  window.removeDate = d => get(ref(db, 'dates')).then(s => set(ref(db, 'dates'), (s.val() || []).filter(x => x !== d)));

  window.addDeliveryRange = () => { const km = parseFloat(document.getElementById('rangeKm').value), price = parseFloat(document.getElementById('rangePrice').value); if(km && !isNaN(price)) { currentRanges.push({ maxKm: km, price: price }); currentRanges.sort((a,b) => a.maxKm - b.maxKm); renderRanges(); } }
  window.removeRange = idx => { currentRanges.splice(idx, 1); renderRanges(); }
  function renderRanges() { document.getElementById('deliveryRangesList').innerHTML = currentRanges.map((r, i) => `<div style="display:flex; justify-content:space-between; margin:10px 0">${r.maxKm}km = R$ ${r.price} <button onclick="removeRange(${i})">✕</button></div>`).join(''); }

  window.searchBakeryCEP = async () => { const cep = document.getElementById('cfgCEP').value, num = document.getElementById('cfgNumber').value; const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`), d = await r.json(), addr = `${d.logradouro}, ${num}, ${d.localidade}`; document.getElementById('cfgAddress').value = addr; const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr+', Brasil')}`), gd = await g.json(); if(gd[0]) update(ref(db, 'settings'), { storeLat: parseFloat(gd[0].lat), storeLng: parseFloat(gd[0].lon) }); }
  window.saveAllSettings = () => { const s = { whatsapp: document.getElementById('cfgWA').value, storeNumber: document.getElementById('cfgNumber').value, storeCEP: document.getElementById('cfgCEP').value, storeAddress: document.getElementById('cfgAddress').value, deliveryRanges: currentRanges }; if(tempHeroData) s.heroImg = tempHeroData; update(ref(db, 'settings'), s).then(() => showToast("Salvo!")); }
  function syncSettings() { get(ref(db, 'settings')).then(s => { const v = s.val() || {}; document.getElementById('cfgWA').value = v.whatsapp || ""; document.getElementById('cfgNumber').value = v.storeNumber || ""; document.getElementById('cfgCEP').value = v.storeCEP || ""; document.getElementById('cfgAddress').value = v.storeAddress || ""; currentRanges = v.deliveryRanges || []; renderRanges(); }); }

  window.resetForm = () => { document.getElementById('productForm').reset(); document.getElementById('prodId').value=""; }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=> t.style.display='none', 3000); }
</script>
</body>
</html>
