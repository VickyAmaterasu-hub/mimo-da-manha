<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mimo Admin - Profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF; --green:#4E7A3E;
  --shadow:0 10px 30px rgba(51,55,47,0.08); --radius:20px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust); display:flex; min-height:100vh; overflow-x:hidden;}

/* LOGIN SCREEN */
.login-screen{position:fixed; inset:0; background:var(--crust); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:#fff; padding:40px 30px; border-radius:30px; text-align:center; width:100%; max-width:380px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);}
.login-card h1{font-family:var(--font-display); margin:0 0 10px; color:var(--crust);}

/* SIDEBAR (DESKTOP) */
.sidebar{width:260px; background:var(--crust); color:var(--cream); padding:40px 20px; display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100;}
.brand-admin{font-family:var(--font-display); font-size:1.5rem; margin-bottom:40px; display:flex; align-items:center; gap:12px; color:#fff; padding-left:10px;}
.sidebar nav{display:flex; flex-direction:column; gap:8px; flex:1;}
.sidebar nav button{text-align:left; background:none; border:none; color:rgba(255,255,255,0.5); padding:14px 18px; border-radius:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:12px; font-size:1rem; transition:0.3s;}
.sidebar nav button:hover{color:#fff; background:rgba(255,255,255,0.05);}
.sidebar nav button.active{background:var(--jam); color:#fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
.logout-btn{margin-top:auto; border:1px solid rgba(255,255,255,0.1); background:none; color:rgba(255,255,255,0.6); padding:12px; border-radius:12px; cursor:pointer; font-weight:600;}

/* CONTENT AREA */
.main-content{flex:1; margin-left:260px; padding:40px; width:100%;}
.panel{display:none; animation: fadeIn 0.4s ease-out;}
.panel.active{display:block;}
@keyframes fadeIn { from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:translateY(0);} }

h2{font-family:var(--font-display); font-size:2.2rem; margin:0 0 25px; color:var(--crust);}
.card{background:#fff; border-radius:var(--radius); padding:25px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:25px; position:relative; overflow:hidden;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:25px;}

/* TABELAS */
.table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 15px; background: #fff; }
table{width:100%; border-collapse:collapse; min-width:700px;}
th{text-align:left; padding:18px 15px; border-bottom:2px solid var(--line); font-size:12px; color:var(--crust-soft); text-transform:uppercase; letter-spacing:1px;}
td{padding:18px 15px; border-bottom:1px solid var(--line); font-size:14px;}

/* BOTÕES E CAMPOS */
.btn{padding:12px 22px; border-radius:100px; font-weight:700; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:0.2s; font-size:14px; white-space:nowrap;}
.btn-primary{background:var(--jam); color:#fff;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--crust);}
.btn-success{background:var(--green); color:#fff;}
.btn-danger{background:#fee2e2; color:#b91c1c;}

input, select, textarea { 
    width:100%; padding:14px; border:1.5px solid var(--line); border-radius:14px; 
    font-family:inherit; margin-bottom:12px; background:#f9f8f4; font-size:16px; transition: 0.2s;
}
input:focus { border-color: var(--jam); outline: none; background: #fff; }
label{display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--crust-soft); text-transform: uppercase; letter-spacing: 0.5px;}

/* STATUS BADGES */
.status-badge{padding:8px 14px; border-radius:100px; font-size:11px; font-weight:800; text-transform:uppercase; border:none; cursor:pointer;}
.st-preparacao{background: #fff4e5; color: #b76e00;}
.st-concluido{background: #e6f4ea; color: #1e7e34;}
.st-cancelado{background: #fce8e6; color: #c5221f;}

/* CHIPS DE CATEGORIA */
.cat-chip {
    background: var(--dawn-1); color: var(--jam-dark); padding: 8px 16px; 
    border-radius: 100px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
}
.cat-chip button { background: none; border: none; color: #b91c1c; cursor: pointer; font-size: 18px; padding: 0; display: flex; }

/* MOBILE AJUSTES (ESTILO APP) */
@media (max-width: 900px) {
  body { flex-direction: column; background: #fcfbf7; }
  .sidebar {
    width: 100%; height: 75px; bottom: 0; top: auto; left: 0;
    padding: 0 10px; flex-direction: row; border-top: 1px solid var(--line);
    background: #fff; box-shadow: 0 -5px 25px rgba(0,0,0,0.06);
  }
  .brand-admin, .logout-btn { display: none; }
  .sidebar nav { flex-direction: row; justify-content: space-around; align-items: center; width: 100%; gap: 0; }
  .sidebar nav button {
    flex-direction: column; font-size: 10px; gap: 4px; padding: 8px 5px;
    border-radius: 0; align-items: center; color: var(--crust-soft); flex: 1;
  }
  .sidebar nav button span { font-size: 20px; }
  .sidebar nav button.active { background: none; color: var(--jam); position: relative; }
  .sidebar nav button.active::after { content: ''; position: absolute; top: 0; width: 30px; height: 3px; background: var(--jam); border-radius: 0 0 5px 5px; }

  .main-content { margin-left: 0; padding: 20px 15px 100px; }
  h2 { font-size: 1.8rem; text-align: center; }
  .grid-2 { grid-template-columns: 1fr; gap: 15px; }
  
  .header-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .header-row div { justify-content: center; width: 100%; }
  
  .card { padding: 20px 15px; }
  .btn { width: 100%; }
  .btn-inline { width: auto; }
}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--crust); color:#fff; padding:15px 30px; border-radius:100px; z-index:3000; display:none; font-weight:600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <span>🥐</span>
    <h1>Mimo Admin</h1>
    <p style="color:var(--crust-soft); margin-bottom:25px;">Acesso Restrito</p>
    <input type="email" id="emailInput" placeholder="E-mail Administrativo">
    <input type="password" id="passInput" placeholder="Senha Secreta">
    <button class="btn btn-primary" style="width:100%; padding:16px;" onclick="tryLogin()">Acessar Painel</button>
  </div>
</div>

<aside class="sidebar">
  <div class="brand-admin">🥐 Mimo Admin</div>
  <nav>
    <button data-panel="pedidos" class="active"><span>📦</span>Pedidos</button>
    <button data-panel="produtos"><span>🥐</span>Cardápio</button>
    <button data-panel="agenda"><span>📅</span>Datas</button>
    <button data-panel="config"><span>⚙️</span>Ajustes</button>
  </nav>
  <button class="logout-btn" onclick="logout()">Encerrar Sessão</button>
</aside>

<main class="main-content">
  
  <!-- PAINEL PEDIDOS -->
  <section class="panel active" id="panel-pedidos">
    <div class="header-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Pedidos</h2>
        <button class="btn btn-success btn-inline" onclick="exportOrdersToExcel()">📊 Exportar Excel</button>
    </div>
    
    <div class="card" style="padding: 15px;">
        <label>Filtrar por data do pedido</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="filterDate" style="margin-bottom:0; flex:1;">
            <button class="btn btn-primary btn-inline" onclick="applyOrderFilter()">Filtrar</button>
            <button class="btn btn-outline btn-inline" onclick="clearOrderFilter()">Limpar</button>
        </div>
    </div>

    <div class="card" style="padding: 0;">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Data/Hora</th><th>Status</th><th>Cliente</th><th>Resumo</th><th>Total</th><th>Ações</th></tr></thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>
  </section>

  <!-- PAINEL CARDÁPIO -->
  <section class="panel" id="panel-produtos">
    <h2>Gestão de Cardápio</h2>
    
    <div class="grid-2">
        <!-- Novo/Editar -->
        <div class="card">
            <h3 id="formTitle" style="margin-top:0">Novo Produto</h3>
            <form id="productForm" onsubmit="return saveProduct(event)">
                <input type="hidden" id="prodId">
                <label>Nome</label><input type="text" id="prodName" required>
                <label>Categoria</label><select id="prodCategory" required></select>
                <label>Preço (R$)</label><input type="number" id="prodPrice" step="0.01" required>
                <label>Foto do Produto</label><input type="file" id="prodImage" accept="image/*" onchange="handleFile(this, 'product')">
                <label>Descrição</label><textarea id="prodDesc" rows="2"></textarea>
                <div id="prodImgPreview" style="margin-bottom:15px;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Salvar Produto</button>
                <button type="button" class="btn btn-outline" onclick="resetForm()" style="width:100%; margin-top:8px">Cancelar / Limpar</button>
            </form>
        </div>

        <!-- Categorias -->
        <div class="card">
            <h3 style="margin-top:0">Categorias</h3>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" id="newCatName" placeholder="Nova..." style="margin-bottom:0">
                <button class="btn btn-primary btn-inline" onclick="addCategory()">Add</button>
            </div>
            <div id="categoryList" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>
    </div>

    <div class="card" style="padding: 0;">
        <div class="table-responsive">
            <table>
                <thead><tr><th>Foto</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr></thead>
                <tbody id="productsBody"></tbody>
            </table>
        </div>
    </div>
  </section>

  <!-- PAINEL AGENDA -->
  <section class="panel" id="panel-agenda">
    <h2>Datas Disponíveis</h2>
    <div class="card">
        <label>Abrir nova data no site</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="newDate" style="margin-bottom:0; flex:1;">
            <button class="btn btn-primary btn-inline" onclick="addDate()">Adicionar</button>
        </div>
    </div>
    <div id="dateList" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:15px;"></div>
  </section>

  <!-- PAINEL AJUSTES -->
  <section class="panel" id="panel-config">
    <h2>Ajustes</h2>
    
    <div class="card">
        <h3>🖼️ Imagem do Site</h3>
        <label>Foto do topo (Hero)</label>
        <input type="file" id="heroFile" accept="image/*" onchange="handleFile(this, 'hero')">
        <div id="heroPreview" style="margin-top:10px; width:100%; height:120px; border-radius:15px; background:var(--cream); overflow:hidden; display:flex; align-items:center; justify-content:center; border:2px dashed var(--line);"></div>
    </div>

    <div class="card">
        <h3>📍 Localização da Padaria</h3>
        <div style="display:flex; gap:10px;">
            <div style="flex:2"><label>CEP</label><input type="text" id="cfgCEP" maxlength="9"></div>
            <div style="flex:1"><label>Nº</label><input type="text" id="cfgNumber"></div>
            <button class="btn btn-primary btn-inline" style="margin-top:22px;" onclick="searchBakeryCEP()">OK</button>
        </div>
        <label>Endereço</label>
        <input type="text" id="cfgAddress" readonly>
    </div>

    <div class="card">
        <h3>💬 WhatsApp e Frete</h3>
        <label>Número WhatsApp (com DDD)</label>
        <input type="text" id="cfgWA" placeholder="5511...">
        <div class="grid-2">
            <div><label>R$ por KM</label><input type="number" id="cfgKmFee" step="0.10"></div>
            <div><label>Frete Mínimo (R$)</label><input type="number" id="cfgMinFee" step="0.10"></div>
        </div>
    </div>
    
    <button class="btn btn-primary" onclick="saveAllSettings()" style="width:100%; padding:20px; font-size:1.1rem; margin-bottom: 20px;">Salvar Todas as Configurações</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAEcISPJh7Eoo4QlTygiB3NmLyPzjNr7w",
    authDomain: "mimo-da-manha.firebaseapp.com",
    databaseURL: "https://mimo-da-manha-default-rtdb.firebaseio.com",
    projectId: "mimo-da-manha",
    storageBucket: "mimo-da-manha.firebasestorage.app",
    messagingSenderId: "378412741404",
    appId: "1:378412741404:web:f091f18e4c40c9bf4800d9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let currentProducts = [];
  let currentCategories = [];
  let currentOrders = {};
  let tempHeroData = "";
  let tempProductImageData = "";

  // LOGIN
  window.tryLogin = async () => {
    const e = document.getElementById('emailInput').value;
    const p = document.getElementById('passInput').value;
    try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Acesso negado."); }
  }
  window.logout = () => signOut(auth).then(()=> location.reload());
  onAuthStateChanged(auth, user => { if(user) { document.getElementById('loginScreen').style.display='none'; initApp(); } });

  function initApp() { syncOrders(); syncProducts(); syncSettings(); syncCategories(); syncDates(); }

  // NAVEGAÇÃO
  document.querySelectorAll('.sidebar nav button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
      window.scrollTo(0,0);
    };
  });

  // PEDIDOS
  function syncOrders() {
    onValue(ref(db, 'orders'), snap => {
      currentOrders = snap.val() || {};
      renderOrders();
    });
  }

  function renderOrders(filterDate = "") {
    const body = document.getElementById('ordersBody');
    let orders = Object.entries(currentOrders).reverse();
    if(filterDate) orders = orders.filter(([id, o]) => o.createdAt.includes(filterDate));

    body.innerHTML = orders.map(([id, o]) => `
      <tr>
        <td style="font-weight:600">${new Date(o.createdAt).toLocaleString('pt-BR')}</td>
        <td><select onchange="updateStatus('${id}', this.value)" class="status-badge st-${o.status || 'preparacao'}"><option value="preparacao" ${o.status==='preparacao'?'selected':''}>Pendente</option><option value="concluido" ${o.status==='concluido'?'selected':''}>Concluído</option><option value="cancelado" ${o.status==='cancelado'?'selected':''}>Cancelado</option></select></td>
        <td>${o.customer.name}</td>
        <td style="font-size:12px; color:var(--crust-soft)">${o.items.map(i => `${i.qty}x ${i.name}`).join('<br>')}</td>
        <td style="font-weight:700">R$ ${o.total.toFixed(2)}</td>
        <td><button class="btn btn-danger" style="padding:6px" onclick="deleteOrder('${id}')">🗑️</button></td>
      </tr>
    `).join('');
  }

  window.applyOrderFilter = () => renderOrders(document.getElementById('filterDate').value);
  window.clearOrderFilter = () => { document.getElementById('filterDate').value = ""; renderOrders(); }
  window.updateStatus = (id, val) => update(ref(db, `orders/${id}`), { status: val }).then(()=>showToast("Status atualizado!"));
  window.deleteOrder = id => confirm("Excluir permanentemente?") && remove(ref(db, `orders/${id}`));

  // PRODUTOS & FOTOS
  function syncProducts() {
    onValue(ref(db, 'products'), snap => {
      currentProducts = snap.val() || [];
      document.getElementById('productsBody').innerHTML = currentProducts.map((p, idx) => `
        <tr>
          <td><img src="${p.img}" width="45" height="45" style="border-radius:10px; object-fit:cover;"></td>
          <td><strong>${p.name}</strong><br><small style="color:var(--crust-soft)">${p.category}</small></td>
          <td>${p.category}</td>
          <td>R$ ${p.price.toFixed(2)}</td>
          <td style="display:flex; gap:5px;">
            <button class="btn btn-outline" onclick="editProduct(${idx})">✏️</button>
            <button class="btn btn-danger" onclick="deleteProduct(${idx})">🗑️</button>
          </td>
        </tr>
      `).join('');
    });
  }

  window.handleFile = (input, type) => {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxW = type === 'hero' ? 1000 : 500;
            const ratio = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * ratio;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = canvas.toDataURL('image/jpeg', 0.7);
            if(type === 'hero') {
                tempHeroData = data;
                document.getElementById('heroPreview').innerHTML = `<img src="${data}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                tempProductImageData = data;
                document.getElementById('prodImgPreview').innerHTML = `<img src="${data}" width="80" style="border-radius:12px;">`;
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }

  window.saveProduct = (e) => {
    e.preventDefault();
    const id = document.getElementById('prodId').value;
    const p = {
        name: document.getElementById('prodName').value,
        category: document.getElementById('prodCategory').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        desc: document.getElementById('prodDesc').value,
        active: document.getElementById('prodActive').checked,
        img: tempProductImageData || (id !== "" ? currentProducts[id].img : ""),
        id: id !== "" ? currentProducts[id].id : "p"+Date.now()
    };
    if(id !== "") currentProducts[id] = p; else currentProducts.push(p);
    set(ref(db, 'products'), currentProducts).then(()=> { showToast("Salvo com sucesso!"); resetForm(); });
    return false;
  }

  window.editProduct = idx => {
    const p = currentProducts[idx];
    document.getElementById('prodId').value = idx;
    document.getElementById('prodName').value = p.name;
    document.getElementById('prodCategory').value = p.category;
    document.getElementById('prodPrice').value = p.price;
    document.getElementById('prodDesc').value = p.desc || "";
    document.getElementById('prodActive').checked = p.active;
    document.getElementById('prodImgPreview').innerHTML = `<img src="${p.img}" width="80" style="border-radius:12px;">`;
    document.getElementById('formTitle').innerText = "Editando Produto";
    document.querySelector('[data-panel="produtos"]').click();
  }

  window.deleteProduct = idx => confirm("Excluir este produto?") && currentProducts.splice(idx,1) && set(ref(db, 'products'), currentProducts);

  // CATEGORIAS
  function syncCategories() {
    onValue(ref(db, 'categories'), s => {
        currentCategories = s.val() || ["Pães", "Cookies", "Geleias"];
        document.getElementById('prodCategory').innerHTML = currentCategories.map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('categoryList').innerHTML = currentCategories.map(c => `
            <div class="cat-chip">
                ${c} <button onclick="removeCategory('${c}')">×</button>
            </div>
        `).join('');
    });
  }
  window.addCategory = () => {
    const n = document.getElementById('newCatName').value.trim();
    if(n && !currentCategories.includes(n)) { currentCategories.push(n); set(ref(db, 'categories'), currentCategories); document.getElementById('newCatName').value=""; }
  }
  window.removeCategory = c => confirm("Remover?") && set(ref(db, 'categories'), currentCategories.filter(x => x !== c));

  // AGENDA
  function syncDates() {
    onValue(ref(db, 'dates'), s => {
        const dates = s.val() || [];
        document.getElementById('dateList').innerHTML = dates.map(d => `
            <div class="card" style="padding:15px; margin-bottom:0; display:flex; justify-content:space-between; align-items:center; background:var(--white); border-color:var(--dawn-1)">
                <strong>${d.split('-').reverse().join('/')}</strong>
                <button class="btn btn-danger" style="padding:5px 10px" onclick="removeDate('${d}')">✕</button>
            </div>
        `).join('');
    });
  }
  window.addDate = () => {
    const d = document.getElementById('newDate').value;
    if(!d) return;
    get(ref(db, 'dates')).then(snap => {
        let list = snap.val() || [];
        if(!list.includes(d)) { list.push(d); set(ref(db, 'dates'), list.sort()); }
    });
  }
  window.removeDate = d => confirm("Remover?") && get(ref(db, 'dates')).then(snap => {
    let list = snap.val() || [];
    set(ref(db, 'dates'), list.filter(x => x !== d));
  });

  // AJUSTES & CEP
  window.searchBakeryCEP = async () => {
    const cep = document.getElementById('cfgCEP').value.replace(/\D/g,'');
    const num = document.getElementById('cfgNumber').value;
    if(cep.length !== 8) return;
    try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        const addr = `${d.logradouro}, ${num}, ${d.localidade}`;
        document.getElementById('cfgAddress').value = addr;
        const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr+', Brasil')}`);
        const gd = await g.json();
        if(gd[0]) {
            update(ref(db, 'settings'), { storeLat: parseFloat(gd[0].lat), storeLng: parseFloat(gd[0].lon) });
            showToast("📍 Endereço validado!");
        }
    } catch(err) { alert("Erro ao buscar CEP"); }
  }

  window.saveAllSettings = () => {
    const s = {
        whatsapp: document.getElementById('cfgWA').value,
        deliveryPerKm: parseFloat(document.getElementById('cfgKmFee').value) || 0,
        deliveryMinFee: parseFloat(document.getElementById('cfgMinFee').value) || 0,
        storeNumber: document.getElementById('cfgNumber').value,
        storeCEP: document.getElementById('cfgCEP').value,
        storeAddress: document.getElementById('cfgAddress').value
    };
    if(tempHeroData) s.heroImg = tempHeroData;
    update(ref(db, 'settings'), s).then(() => showToast("✨ Ajustes salvos!"));
  }

  function syncSettings() {
    get(ref(db, 'settings')).then(snap => {
      const v = snap.val() || {};
      document.getElementById('cfgWA').value = v.whatsapp || "";
      document.getElementById('cfgKmFee').value = v.deliveryPerKm || "";
      document.getElementById('cfgMinFee').value = v.deliveryMinFee || "";
      document.getElementById('cfgNumber').value = v.storeNumber || "";
      document.getElementById('cfgCEP').value = v.storeCEP || "";
      document.getElementById('cfgAddress').value = v.storeAddress || "";
      if(v.heroImg) document.getElementById('heroPreview').innerHTML = `<img src="${v.heroImg}" style="width:100%; height:100%; object-fit:cover;">`;
    });
  }

  // AUXILIARES
  window.resetForm = () => { 
    document.getElementById('productForm').reset(); document.getElementById('prodId').value=""; 
    document.getElementById('prodImgPreview').innerHTML=""; document.getElementById('formTitle').innerText = "Novo Produto";
    tempProductImageData = "";
  }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=> t.style.display='none', 3000); }
  window.exportOrdersToExcel = function() {
    const table = document.querySelector("#ordersBody").parentElement;
    const wb = XLSX.utils.table_to_book(table);
    XLSX.writeFile(wb, "Pedidos_Mimo.xlsx");
  }
</script>
</body>
</html>
