<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimo da manhã — Padaria artesanal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF;
  --shadow: 0 12px 40px rgba(51,55,47,0.12); --radius: 18px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
header.site{position:sticky;top:0;z-index:50;background:rgba(245,244,239,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1160px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-mark{width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,var(--dawn-1),var(--dawn-2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 4px 12px rgba(91,122,73,0.2);}
.brand-text{font-family:var(--font-display);font-weight:600;font-size:1.35rem;color:var(--crust);line-height:1;}
.brand-text small{display:block;font-family:var(--font-body);font-weight:500;font-size:0.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crust-soft);margin-top:3px;}
.cart-btn{background:var(--crust);color:var(--cream);border:none;padding:10px 20px;border-radius:100px;font-weight:600;display:flex;align-items:center;gap:8px;}

/* HERO SECTION */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg, var(--dawn-1) 0%, var(--cream) 100%);padding:70px 24px 50px;}
.hero-inner{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1.1fr 0.9fr;gap:50px;align-items:center;}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,4.5vw,3.5rem);line-height:1.08;margin:0 0 18px;color:var(--crust);}
.hero-photo-card{background:#fff;padding:16px;border-radius:24px;box-shadow:var(--shadow);transform:rotate(2deg);width:100%;}
.hero-photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;}

/* GRID DE PRODUTOS */
.catalog{padding:60px 24px 90px;}
.grid{max-width:1160px;margin:28px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:0.2s;}
.card-img{aspect-ratio:4/3;width:100%;object-fit:cover;}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1;}
.price{font-weight:700;font-size:1.1rem;color:var(--crust);}
.add-btn{background:var(--cream-2);border:1px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:1.3rem;display:flex;align-items:center;justify-content:center;}

/* MODAIS */
.overlay{position:fixed;inset:0;background:rgba(51,55,47,0.45);opacity:0;pointer-events:none;z-index:90;transition:0.2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.modal-overlay{position:fixed;inset:0;background:rgba(51,55,47,0.5);display:none;align-items:center;justify-content:center;z-index:110;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--cream);border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;}

/* MOBILE ADJUSTMENTS */
@media (max-width:920px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ 
  .grid{grid-template-columns:1fr;} 
  .hero-inner{grid-template-columns:1fr; text-align:center;}
  .hero-photo-card{max-width:100%; transform:rotate(0deg); margin-top:20px;}
  .hero-photo-card img { aspect-ratio: 1/1; } /* Foto maior e quadrada no mobile */
}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--jam);color:#fff;padding:14px 24px;border-radius:100px;opacity:0;transition:0.25s;z-index:9999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <a href="#top" class="brand">
      <span class="brand-mark">🥐</span>
      <span class="brand-text">Mimo da manhã<small>Padaria artesanal</small></span>
    </a>
    <button class="cart-btn" onclick="openCheckout()">🧺 Carrinho <span id="cartCount">0</span></button>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-inner">
    <div>
      <h1>Cheirinho de pão saindo do forno, <em>direto pra sua mesa.</em></h1>
      <p>Pães, biscoitos e geleias feitos com carinho. Peça pelo site e finalize no WhatsApp.</p>
      <a href="#catalogo" class="btn-primary" style="padding:15px 30px; border-radius:100px; text-decoration:none; font-weight:700; display:inline-block; background:var(--jam); color:white;">Ver cardápio</a>
    </div>
    <div class="hero-photo-card">
        <img id="heroImageElement" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600" alt="Nossa padaria">
    </div>
  </div>
</section>

<section class="catalog" id="catalogo">
  <div class="wrap">
    <h2 style="font-family:var(--font-display); font-size:2rem">Nosso Cardápio</h2>
    <div class="grid" id="productGrid"></div>
  </div>
</section>

<div class="overlay" id="overlay" onclick="closeCheckout()"></div>

<div class="modal-overlay" id="checkoutOverlay">
  <div class="modal">
    <h2 style="font-family:var(--font-display); margin-top:0">Finalizar Pedido</h2>
    <div id="checkoutSummary" style="background:#fff; padding:15px; border-radius:14px; margin-bottom:20px; border:1px solid var(--line)"></div>
    <form id="checkoutForm" onsubmit="return submitCheckout(event)">
      <div class="field"><label>Seu nome</label><input type="text" id="custName" required></div>
      <div class="field"><label>WhatsApp</label><input type="tel" id="custPhone" placeholder="(11) 9xxxx-xxxx" required></div>
      <div class="field">
        <label>Recebimento</label>
        <select id="deliveryType" onchange="toggleDeliveryFields()" required>
            <option value="Retirada">Retirada no local</option>
            <option value="Entrega">Entrega por motoboy</option>
        </select>
      </div>
      <div id="deliveryFields" style="display:none;">
        <div class="field"><label>CEP de entrega</label><input type="text" id="custCep" oninput="onCepInput()" placeholder="00000-000"></div>
        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:10px">
            <div class="field"><label>Rua/Av</label><input type="text" id="custAddr" placeholder="Endereço"></div>
            <div class="field"><label>Nº</label><input type="text" id="custNum" oninput="onNumInput()" placeholder="123"></div>
        </div>
        <div class="field"><label>KM Estimado</label><input type="text" id="custKm" readonly style="background:#eee"></div>
        <div id="cepHint" style="font-size:12px; color:var(--crust-soft); margin-top:-10px; margin-bottom:15px;"></div>
      </div>
      <div class="field"><label>Data Agendada</label><select id="custDate" required></select></div>
      <div class="field"><label>Pagamento</label><select id="pay" required><option value="Pix">Pix</option><option value="Cartão">Cartão</option></select></div>
      <button type="submit" style="width:100%; background:#25D366; color:white; border:none; padding:15px; border-radius:100px; font-weight:700; font-size:1rem;">Enviar no WhatsApp</button>
      <button type="button" onclick="closeCheckout()" style="width:100%; margin-top:10px; background:none; border:none; text-decoration:underline">Voltar</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAEcISPJh7Eoo4QlTygiB3NmLyPzjNr7w",
    authDomain: "mimo-da-manha.firebaseapp.com",
    databaseURL: "https://mimo-da-manha-default-rtdb.firebaseio.com",
    projectId: "mimo-da-manha",
    storageBucket: "mimo-da-manha.firebasestorage.app",
    messagingSenderId: "378412741404",
    appId: "1:378412741404:web:f091f18e4c40c9bf4800d9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let CART = [];
  let SETTINGS = {};

  onValue(ref(db, 'settings'), s => {
    SETTINGS = s.val() || {};
    if(SETTINGS.heroImg) document.getElementById('heroImageElement').src = SETTINGS.heroImg;
  });

  onValue(ref(db, 'products'), s => {
    const prods = s.val() || [];
    const grid = document.getElementById('productGrid');
    grid.innerHTML = prods.filter(p=>p.active).map(p => `
      <div class="card">
        <img src="${p.img}" class="card-img">
        <div class="card-body">
          <small style="text-transform:uppercase; font-weight:700; color:var(--jam)">${p.category}</small>
          <h3 style="margin:5px 0">${p.name}</h3>
          <p style="font-size:0.85rem; color:var(--crust-soft); flex:1">${p.desc || ''}</p>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px">
            <span class="price">R$ ${p.price.toFixed(2)}</span>
            <button class="add-btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price})">+</button>
          </div>
        </div>
      </div>
    `).join('');
  });

  onValue(ref(db, 'dates'), s => {
    const dates = s.val() || [];
    document.getElementById('custDate').innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
  });

  window.addToCart = (id, name, price) => {
    const item = CART.find(i => i.id === id);
    if(item) item.qty++; else CART.push({id, name, price, qty:1});
    document.getElementById('cartCount').innerText = CART.reduce((sum,i)=>sum+i.qty,0);
    showToast("Adicionado!");
  }

  window.onCepInput = async () => {
    const cep = document.getElementById('custCep').value.replace(/\D/g,'');
    if(cep.length !== 8) return;
    try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        document.getElementById('custAddr').value = d.logradouro;
        document.getElementById('cepHint').innerText = "Agora digite o número da casa.";
    } catch(e){}
  }

  window.onNumInput = async () => {
    const num = document.getElementById('custNum').value;
    const addr = document.getElementById('custAddr').value;
    if(num.length > 0 && SETTINGS.storeLat) {
        const query = `${addr}, ${num}, ${document.getElementById('custCep').value}, Brasil`;
        const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const gd = await g.json();
        if(gd[0]) {
            const km = calculateDist(SETTINGS.storeLat, SETTINGS.storeLng, gd[0].lat, gd[0].lon);
            document.getElementById('custKm').value = km.toFixed(1);
            document.getElementById('cepHint').innerText = `Distância: ${km.toFixed(1)}km.`;
            renderSummary();
        }
    }
  }

  function calculateDist(l1, ln1, l2, ln2) {
    const R = 6371;
    const dLat = (l2-l1) * Math.PI / 180;
    const dLon = (ln2-ln1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(l1*Math.PI/180) * Math.cos(l2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 1.3;
  }

  window.renderSummary = () => {
    const sub = CART.reduce((sum,i)=>sum+(i.price*i.qty),0);
    const isE = document.getElementById('deliveryType').value === 'Entrega';
    const km = parseFloat(document.getElementById('custKm').value) || 0;
    const f = isE ? Math.max(SETTINGS.deliveryMinFee, km * SETTINGS.deliveryPerKm) : 0;
    document.getElementById('checkoutSummary').innerHTML = `Total Itens: R$ ${sub.toFixed(2)}<br>${isE ? 'Frete: R$ '+f.toFixed(2) : ''}<br><strong>Total: R$ ${(sub+f).toFixed(2)}</strong>`;
  }

  window.submitCheckout = e => {
    e.preventDefault();
    const name = document.getElementById('custName').value;
    const addr = document.getElementById('custAddr').value;
    const num = document.getElementById('custNum').value;
    const type = document.getElementById('deliveryType').value;
    const sub = CART.reduce((sum,i)=>sum+(i.price*i.qty),0);
    const km = parseFloat(document.getElementById('custKm').value) || 0;
    const f = type === 'Entrega' ? Math.max(SETTINGS.deliveryMinFee, km * SETTINGS.deliveryPerKm) : 0;
    
    let msg = `*Novo Pedido - Mimo da Manhã*\nCliente: ${name}\nTipo: ${type}\n`;
    if(type === 'Entrega') msg += `Endereço: ${addr}, Nº ${num}\nDistância: ${km}km\n`;
    msg += `\n*Itens:*\n` + CART.map(i=>`${i.qty}x ${i.name}`).join('\n');
    msg += `\n\n*Total: R$ ${(sub+f).toFixed(2)}*`;

    set(ref(db, 'orders/mimo-'+Date.now()), { createdAt: new Date().toISOString(), customer: {name}, items: CART, total: sub+f, status: 'preparacao' });
    window.open(`https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent(msg)}`);
    return false;
  }

  window.openCheckout = () => { if(CART.length > 0) { document.getElementById('checkoutOverlay').classList.add('show'); renderSummary(); } else alert("Sacola vazia!"); }
  window.closeCheckout = () => document.getElementById('checkoutOverlay').classList.remove('show');
  window.toggleDeliveryFields = () => { document.getElementById('deliveryFields').style.display = document.getElementById('deliveryType').value === 'Entrega' ? 'block' : 'none'; renderSummary(); }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 3000); }
</script>
</body>
</html>
