<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Mimo da Manhã - Sistema Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF; --green:#4E7A3E;
  --shadow:0 8px 30px rgba(51,55,47,0.10); --radius:16px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust); overflow-x:hidden;}
button{font-family:inherit;cursor:pointer; transition: 0.2s;}
input,select,textarea{font-family:inherit; width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff;}

/* LOGIN */
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,var(--dawn-1),var(--dawn-2)); padding:20px;}
.login-card{background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:40px 30px; max-width:400px; width:100%; text-align:center;}
.login-card h1{font-family:var(--font-display); margin:10px 0;}
