<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimo da manhã — Padaria artesanal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F4EF; --cream-2:#EBEAE4; --dawn-1:#C9D6BB; --dawn-2:#A9BF95;
  --crust:#33372F; --crust-soft:#6B6E63; --jam:#5B7A49; --jam-dark:#435C36;
  --butter:#8FA77B; --line:#DEDCD3; --white:#FFFFFF;
  --shadow: 0 12px 40px rgba(51,55,47,0.12); --radius: 18px;
  --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--crust); overflow-x:hidden;}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
header{position:sticky;top:0;z-index:50;background:rgba(245,244,239,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line); padding:15px 0;}

.hero{padding:60px 24px; background:linear-gradient(180deg, var(--dawn-1) 0%, var(--cream) 100%);}
.hero-inner{max-width:1160px; margin:0 auto; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:40px; align-items:center;}
.hero h1{font-family:var(--font-display); font-size:clamp(2.5rem, 5vw, 4rem); line-height:1.1; margin:0 0 20px;}
.hero-photo-card{background:#fff; padding:15px; border-radius:30px; box-shadow:var(--shadow); transform: rotate(2deg); width:100%;}
.hero-photo-card img{width:100%; border-radius:20px; display:block; object-fit:cover; aspect-ratio: 4/3;}

@media (max-width:768px){ .hero-inner{grid-template-columns: 1fr; text-align:center;} .hero-photo-card{max-width:100%; transform: rotate(0deg); margin-top:20px;} }

.grid{display:grid; grid-template-columns: repeat(3, 1fr); gap:25px; margin-top:40px;}
.card{background:#fff; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); display:flex; flex-direction:column; transition:0.3s;}
.card img{width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--cream-2);}
.card-body{padding:20px; flex:1; display:flex; flex-direction:column;}
.card-body h3{font-family:var(--font-display); margin:0 0 10px; font-size:1.2rem;}

@media (max-width:920px){ .grid{grid-template-columns: repeat(2, 1fr);} }
@media (max-width:600px){ .grid{grid-template-columns: 1fr;} }

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:110; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--cream); border-radius:24px; padding:30px; width:100%; max-width:500px; max-height:95vh; overflow-y:auto;}
.field{margin-bottom:15px;}
.field label{display:block; font-weight:600; font-size:0.85rem; margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); font-family:inherit;}
.btn{padding:12px 24px; border-radius:100px; font-weight:700; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-family:inherit;}
.btn-primary{background:var(--jam); color:#fff;}
.wa-btn{background:#25D366; color:#fff; width:100%; justify-content:center;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--jam); color:#fff; padding:12px 25px; border-radius:100px; opacity:0; transition:0.3s; z-index:9999;}
.toast.show{opacity:1;}
#checkoutSummary { background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 15px; line-height: 1.6; }
</style>
</head>
<body>

<header><div class="wrap" style="display:flex; justify-content:space-between; align-items:center"><div style="font-family:var(--font-display); font-weight:700; font-size:1.4rem">🥐 Mimo da manhã</div><button class="btn btn-primary" onclick="openCheckout()">🧺 Sacola <span id="cartCount">0</span></button></div></header>

<section class="hero"><div class="hero-inner"><div><h1>Pão artesanal direto para sua mesa.</h1><p>Fresquinho e feito com carinho sob encomenda.</p><a href="#catalogo" class="btn btn-primary">Ver Cardápio</a></div><div class="hero-photo-card"><img id="heroImageElement" src="" alt="Mimo"></div></div></section>

<section class="wrap" id="catalogo" style="padding:60px 0"><h2 style="font-family:var(--font-display); font-size:2.2rem">Cardápio</h2><div id="productGrid" class="grid"></div></section>

<div class="modal-overlay" id="checkoutOverlay">
  <div class="modal">
    <h2 style="font-family:var(--font-display); margin:0 0 15px">Finalizar Pedido</h2>
    <div id="checkoutSummary"></div>
    <form id="checkoutForm" onsubmit="return submitCheckout(event)">
        <div class="field"><label>Nome</label><input type="text" id="custName" required></div>
        <div class="field"><label>WhatsApp</label><input type="tel" id="custPhone" placeholder="(11) 9xxxx-xxxx" required></div>
        <div class="field"><label>Recebimento</label><select id="deliveryType" onchange="toggleDeliveryFields()" required><option value="Retirada">Retirada no local</option><option value="Entrega">Entrega por Motoboy</option></select></div>
        <div id="deliveryFields" style="display:none">
            <div class="field"><label>CEP</label><input type="text" id="custCep" oninput="onCepInput()" placeholder="00000-000"></div>
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px">
                <div class="field"><label>Rua/Av</label><input type="text" id="custAddr"></div>
                <div class="field"><label>Nº</label><input type="text" id="custNum" oninput="onNumInput()"></div>
            </div>
            <input type="hidden" id="custKm" value="0">
            <div id="cepHint" style="font-size:12px; color:var(--jam); margin-top:-10px; font-weight: 700; margin-bottom: 10px;"></div>
        </div>
        <div class="field"><label>Data Desejada</label><select id="custDate" required></select></div>
        <div class="field"><label>Pagamento</label><select id="pay" required><option value="Pix">Pix</option><option value="Crédito">Crédito</option><option value="Débito">Débito</option><option value="VA">VA</option><option value="VR">VR</option></select></div>
        <button type="submit" class="btn wa-btn">Finalizar e Enviar Pedido</button>
        <button type="button" onclick="closeCheckout()" style="width:100%; margin-top:10px; background:none; border:none; text-decoration:underline; cursor:pointer">Voltar</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCAEcISPJh7Eoo4QlTygiB3NmLyPzjNr7w",
    authDomain: "mimo-da-manha.firebaseapp.com",
    databaseURL: "https://mimo-da-manha-default-rtdb.firebaseio.com",
    projectId: "mimo-da-manha",
    storageBucket: "mimo-da-manha.firebasestorage.app",
    messagingSenderId: "378412741404",
    appId: "1:378412741404:web:f091f18e4c40c9bf4800d9"
  };

  const app = initializeApp(firebaseConfig), db = getDatabase(app);
  let CART = [], SETTINGS = {};

  onValue(ref(db, 'settings'), s => { SETTINGS = s.val() || {}; if(SETTINGS.heroImg) document.getElementById('heroImageElement').src = SETTINGS.heroImg; renderSummary(); });
  onValue(ref(db, 'products'), s => { const p = s.val() || []; document.getElementById('productGrid').innerHTML = p.filter(x=>x.active).map(x => `<div class="card"><img src="${x.img}"><div class="card-body"><h3>${x.name}</h3><div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto"><span class="price">R$ ${x.price.toFixed(2)}</span><button class="btn btn-primary" onclick="addToCart('${x.id}','${x.name}',${x.price})">+</button></div></div></div>`).join(''); });
  onValue(ref(db, 'dates'), s => { document.getElementById('custDate').innerHTML = (s.val() || []).map(d => `<option value="${d}">${d}</option>`).join(''); });

  window.addToCart = (id, n, p) => { const item = CART.find(i => i.id === id); if(item) item.qty++; else CART.push({id, name:n, price:p, qty:1}); document.getElementById('cartCount').innerText = CART.reduce((sum,i)=>sum+i.qty,0); renderSummary(); showToast("Adicionado!"); }
  window.onCepInput = async () => { const c = document.getElementById('custCep').value.replace(/\D/g,''); if(c.length === 8) { const r = await fetch(`https://viacep.com.br/ws/${c}/json/`), d = await r.json(); document.getElementById('custAddr').value = d.logradouro; document.getElementById('cepHint').innerText = "Agora digite o número da casa."; } }
  window.onNumInput = async () => { 
    const num = document.getElementById('custNum').value, addr = document.getElementById('custAddr').value;
    if(num && SETTINGS.storeLat) {
        document.getElementById('cepHint').innerText = "Calculando frete...";
        const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr+', '+num+', Brasil')}`), gd = await g.json();
        if(gd[gd.length -1]) { 
            const km = calculateDist(SETTINGS.storeLat, SETTINGS.storeLng, gd[gd.length -1].lat, gd[gd.length -1].lon);
            document.getElementById('custKm').value = km.toFixed(1);
            document.getElementById('cepHint').innerText = `Distância: ${km.toFixed(1)}km. Frete OK!`;
            renderSummary();
        }
    }
  }

  function calculateDist(l1, ln1, l2, ln2) { const R = 6371, dLat = (l2-l1) * Math.PI / 180, dLon = (ln2-ln1) * Math.PI / 180, a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(l1*Math.PI/180) * Math.cos(l2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2); return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 1.3; }

  window.renderSummary = () => {
    const sub = CART.reduce((sum,i)=>sum+(i.price*i.qty),0), isE = document.getElementById('deliveryType').value === 'Entrega', km = parseFloat(document.getElementById('custKm').value) || 0;
    let f = 0; if(isE && km > 0) { const range = (SETTINGS.deliveryRanges || []).find(r => km <= parseFloat(r.maxKm)); f = range ? parseFloat(range.price) : 0; }
    document.getElementById('checkoutSummary').innerHTML = `<b>Subtotal:</b> R$ ${sub.toFixed(2)}<br>${isE ? '<b>Frete:</b> R$ '+f.toFixed(2) : '<b>Retirada no Local:</b> R$ 0,00'}<br><div style="font-size:18px; margin-top:5px"><b>Total Geral: R$ ${(sub+f).toFixed(2)}</b></div>`;
  }

  window.submitCheckout = e => {
    e.preventDefault();
    const km = parseFloat(document.getElementById('custKm').value) || 0, isE = document.getElementById('deliveryType').value === 'Entrega', sub = CART.reduce((sum,i)=>sum+(i.price*i.qty),0);
    const range = (SETTINGS.deliveryRanges || []).find(r => km <= parseFloat(r.maxKm));
    const f = isE ? (range ? parseFloat(range.price) : 0) : 0;
    
    let msg = `🥐 *Novo Pedido - Mimo da Manhã*\nCliente: ${document.getElementById('custName').value}\nTipo: ${document.getElementById('deliveryType').value}\nPagamento: ${document.getElementById('pay').value}\nData: ${document.getElementById('custDate').value}\n`;
    if(isE) msg += `Endereço: ${document.getElementById('custAddr').value}, Nº ${document.getElementById('custNum').value}\nKM: ${km}km\n`;
    msg += `\n*ÍTENS DO PEDIDO:*\n` + CART.map(i=>`• ${i.qty}x ${i.name} - R$ ${(i.price*i.qty).toFixed(2)}`).join('\n') + `\n\n*TOTAL: R$ ${(sub+f).toFixed(2)}*`;

    set(ref(db, 'orders/mimo-'+Date.now()), { createdAt: new Date().toISOString(), customer: {name: document.getElementById('custName').value}, items: CART, total: sub+f, status: 'preparacao' });
    window.open(`https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent(msg)}`);
    CART = []; document.getElementById('cartCount').innerText="0"; closeCheckout(); return false;
  }

  window.openCheckout = () => { if(CART.length > 0) { document.getElementById('checkoutOverlay').classList.add('show'); renderSummary(); } else alert("Sacola vazia!"); }
  window.closeCheckout = () => document.getElementById('checkoutOverlay').classList.remove('show');
  window.toggleDeliveryFields = () => { document.getElementById('deliveryFields').style.display = document.getElementById('deliveryType').value === 'Entrega' ? 'block' : 'none'; renderSummary(); }
  function showToast(m) { const t = document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 3000); }
</script>
</body>
</html>
